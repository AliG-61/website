<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Şirket İsmi</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --accent: #e10600;
      --bg-card: #111;
      --bg-overlay: rgba(0,0,0,0.6);
      --text: #fff;
      --muted: #ccc;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color: var(--text); background:#111; }
    header {
      background: rgba(0,0,0,0.7);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      gap: 1rem;
      backdrop-filter: saturate(120%) blur(6px);
    }
    .logo { font-weight: 700; letter-spacing: .5px; color: var(--accent); }
    nav { display:flex; gap:1.5rem; align-items:center; flex-wrap:wrap; }
    nav a { color:white; text-decoration:none; font-weight:500; transition:color .3s; }
    nav a:hover, nav a.active { color: var(--accent); }
    #langSelector { display:flex; gap:.5rem; }
    #langSelector button {
      color:#fff; background:transparent; border:1px solid rgba(255,255,255,.2);
      cursor:pointer; font-weight:700; font-size:12px; padding:6px 10px; border-radius:10px; transition: all .25s;
    }
    #langSelector button:hover, #langSelector button.active { background: var(--accent); border-color: var(--accent); }

    main { max-width:1100px; margin:2rem auto; padding:2rem; background: var(--bg-overlay); border-radius:14px; }
    h1 { color: var(--accent); margin-bottom:1rem; }
    .top-btn {
      display:inline-block; padding:0.6rem 1.2rem; background: var(--accent); color:#fff;
      font-weight:bold; border-radius:10px; text-decoration:none; margin-bottom:1.5rem; transition:0.3s;
    }
    .top-btn:hover { background:#c00400; }
    .bungalov-main img.main-img { width:100%; border-radius:14px; margin-bottom:1.5rem; }
    .bungalov-gallery { display:flex; flex-wrap:wrap; gap:1rem; justify-content:center; }
    .bungalov-gallery img { flex:1 1 250px; max-width:300px; border-radius:12px; object-fit:cover; transition:transform 0.3s, box-shadow 0.3s; }
    .bungalov-gallery img:hover { transform:scale(1.05); box-shadow:0 6px 15px rgba(0,0,0,0.2); }

    @media (max-width:768px){ main { margin:1rem; padding:1rem; } }
  </style>
</head>
<body>
  <!-- Header / Navbar -->
  <header>
    <div class="logo">Şirket İsmi</div>
    <nav>
      <a href="index.html" data-i18n="nav.home">Anasayfa</a>
      <a href="turlar.html" data-i18n="nav.turlar">Turlar</a>
      <a href="hakkimizda.html" data-i18n="nav.nedenBiz">Neden Biz?</a>
      <a href="iletisim.html" data-i18n="nav.iletisim">İletişim</a>
    </nav>
    <div id="langSelector"></div>
  </header>

  <!-- Main Bungalov İçerik -->
  <main class="bungalov-main">
    <!-- Üst Buton -->
    <a href="bungalovlar2.html" class="top-btn">Diğer Bungalovları Gör</a>

    <h1 data-i18n="bungalov.title">Bungalov Başlığı</h1>

    <!-- Ana Görsel -->
    <img src="resimler/bungalov.jpg" alt="Bungalov" class="main-img" />

    <!-- Galeri -->
    <div class="bungalov-gallery">
      <img src="resimler/bungalov-ic.jpg" alt="İç Mekan" />
      <img src="resimler/bungalov-manzara.jpg" alt="Manzara" />
      <img src="resimler/bungalov-cevre.jpg" alt="Çevre" />
    </div>
  </main>

  <!-- Footer -->
  <footer>
    © 2025 Ganita Travel. Tüm hakları saklıdır.
  </footer>

  <!-- Dil ve i18n Script -->
  <script>
    const translations = {
      tr: { "nav.home":"Anasayfa", "nav.turlar":"Turlar", "nav.nedenBiz":"Neden Biz?", "nav.iletisim":"İletişim", "bungalov.title":"Bungalov Başlığı" },
      en: { "nav.home":"Home", "nav.turlar":"Tours", "nav.nedenBiz":"Why Us?", "nav.iletisim":"Contact", "bungalov.title":"Bungalow Title" },
      ar: { "nav.home":"الرئيسية", "nav.turlar":"الجولات", "nav.nedenBiz":"لماذا نحن؟", "nav.iletisim":"اتصل بنا", "bungalov.title":"عنوان بنغالو" }
    };

    const langSelector = document.getElementById('langSelector');
    ['tr','en','ar'].forEach(code => {
      const btn = document.createElement('button');
      btn.textContent = code.toUpperCase();
      btn.addEventListener('click', () => setLanguage(code));
      langSelector.appendChild(btn);
    });

    function setLanguage(lang) {
      localStorage.setItem('siteLang', lang);
      applyLanguage(lang);
    }

    function applyLanguage(lang){
      document.documentElement.lang = lang;
      document.documentElement.dir = (lang==='ar')?'rtl':'ltr';
      document.querySelectorAll('#langSelector button').forEach(btn=>{
        btn.classList.toggle('active', btn.textContent.toLowerCase()===lang);
      });
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        const key = el.getAttribute('data-i18n');
        if(translations[lang] && translations[lang][key]){
          el.innerHTML = translations[lang][key];
        }
      });
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      const savedLang = localStorage.getItem('siteLang') || 'tr';
      applyLanguage(savedLang);
    });
  </script>
</body>
</html>
