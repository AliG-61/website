<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Şirket İsmi</title>
  <meta name="description" content="(Şirket İsmi) iletişim sayfası. Rezervasyon, sorular ve işbirlikleri için bizimle iletişime geçin." />
  <meta name="keywords" content="(Şirket İsmi) iletişim, Trabzon bungalov rezervasyon, Karadeniz turları iletişim" />
  <meta name="author" content="Şirket İsmi" />

  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --accent: #e10600;
      --bg-card: #111;
      --bg-overlay: rgba(0,0,0,0.6);
      --text: #fff;
      --muted: #ccc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: url('backgraund.jpg') no-repeat center top scroll;
      background-size: cover;
    }
    header {
      background: rgba(0,0,0,0.7);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      gap: 1rem;
      backdrop-filter: saturate(120%) blur(6px);
    }
    .logo { font-weight: 700; letter-spacing: .5px; }
    nav { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
    nav a {
      color: white; text-decoration: none; font-weight: 500; transition: color .3s;
    }
    nav a:hover, nav a.active { color: var(--accent); }
    #langSelector { display: flex; gap: .5rem; }
    #langSelector button {
      color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.2);
      cursor: pointer; font-weight: 700; font-size: 12px; padding: 6px 10px; border-radius: 10px; transition: all .25s;
    }
    #langSelector button:hover, #langSelector button.active { background: var(--accent); border-color: var(--accent); }

    .section { padding: 4rem 2rem; background: var(--bg-overlay); }
    .section h2 { text-align: center; font-size: 2rem; margin: 0 0 2rem; color: var(--accent); }

    .contact-container { 
      max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 2rem;
    }
    .contact-info, .contact-form {
      background: var(--bg-card); padding: 1.5rem; border-radius: 14px; box-shadow: 0 0 10px rgba(255,255,255,0.08);
    }
    .contact-info h3, .contact-form h3 { color: var(--accent); margin-bottom: 1rem; }
    .contact-info p { margin: .5rem 0; color: #eaeaea; }
    .contact-info a { color: var(--accent); text-decoration: none; }
    .contact-form form { display: flex; flex-direction: column; gap: 1rem; }
    .contact-form input, .contact-form textarea {
      padding: .75rem 1rem; border-radius: 10px; border: 1px solid #444;
      background: #222; color: #fff; font-size: 1rem; resize: none;
    }
    .contact-form button {
      background: var(--accent); color: #fff; border: none; padding: .9rem;
      border-radius: 999px; cursor: pointer; font-weight: 700;
      transition: background .3s;
    }
    .contact-form button:hover { background: #b80500; }
    iframe { width: 100%; height: 250px; border: none; border-radius: 10px; margin-top: 1rem; }

    footer { padding: 2rem; background: rgba(0,0,0,0.85); text-align: center; color: var(--muted); }

    /* RTL uyum */
    html[dir="rtl"] body { direction: rtl; }
    html[dir="rtl"] header, html[dir="rtl"] .contact-container { direction: rtl; }
    html[dir="rtl"] nav { flex-direction: row-reverse; }
    html[dir="rtl"] .section h2, html[dir="rtl"] .contact-info, html[dir="rtl"] .contact-form { text-align: right; }

    @media (max-width: 768px) { .contact-container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div style="color:red" class="logo">Şirket İsmi</div>
    <nav>
      <a href="bungalovlar2.html" data-i18n="nav.bungalovlar">Bungalovlar</a>
      <a href="turlar.html" data-i18n="nav.turlar">Turlar</a>
      <a href="hakkimizda.html" data-i18n="nav.nedenBiz">Neden Biz?</a>
      <a href="iletisim.html" class="active" data-i18n="nav.iletisim">İletişim</a>
    </nav>
    <div id="langSelector"></div>
  </header>

  <section class="section">
    <h2 data-i18n="contact.title">Bizimle İletişime Geçin</h2>
    <div class="contact-container">
      <!-- Bilgi -->
      <div class="contact-info">
        <h3 data-i18n="contact.info.title">İletişim Bilgileri</h3>
        <p><strong>Tel:</strong> <a href="tel:+905416525391">+90 541 652 53 91</a></p>
        <p><strong>Email:</strong> <a href="mailto:aag61ts1967@gmail.com">info@ganitatravel.com</a></p>
        <p><strong data-i18n="contact.address">Adres:</strong> Trabzon, Türkiye</p>
        <iframe src="https://maps.app.goo.gl/4vNDdoK62C4x9L7eA"></iframe>
      </div>
      <!-- Form -->
      <div class="contact-form">
        <h3 data-i18n="contact.form.title">Mesaj Gönderin</h3>
        <form>
          <input type="text" placeholder="Adınız" data-i18n-placeholder="contact.form.name" required />
          <input type="email" placeholder="E-posta" data-i18n-placeholder="contact.form.email" required />
          <textarea rows="5" placeholder="Mesajınız" data-i18n-placeholder="contact.form.message" required></textarea>
          <button type="submit" data-i18n="contact.form.send">Gönder</button>
        </form>
      </div>
    </div>
  </section>

  <footer>
    © 2025 Ganita Travel. Tüm hakları saklıdır.
  </footer>

  <script>
    const translations = {
      tr: {
        "nav.bungalovlar": "Bungalovlar",
        "nav.turlar": "Turlar",
        "nav.nedenBiz": "Neden Biz?",
        "nav.iletisim": "İletişim",
        "contact.title": "Bizimle İletişime Geçin",
        "contact.info.title": "İletişim Bilgileri",
        "contact.address": "Adres:",
        "contact.form.title": "Mesaj Gönderin",
        "contact.form.name": "Adınız",
        "contact.form.email": "E-posta",
        "contact.form.message": "Mesajınız",
        "contact.form.send": "Gönder"
      },
      en: {
        "nav.bungalovlar": "Bungalows",
        "nav.turlar": "Tours",
        "nav.nedenBiz": "Why Us?",
        "nav.iletisim": "Contact",
        "contact.title": "Get in Touch",
        "contact.info.title": "Contact Information",
        "contact.address": "Address:",
        "contact.form.title": "Send a Message",
        "contact.form.name": "Your Name",
        "contact.form.email": "Your Email",
        "contact.form.message": "Your Message",
        "contact.form.send": "Send"
      },
      ar: {
        "nav.bungalovlar": "الأكواخ",
        "nav.turlar": "الجولات",
        "nav.nedenBiz": "لماذا نحن؟",
        "nav.iletisim": "اتصل",
        "contact.title": "تواصل معنا",
        "contact.info.title": "معلومات الاتصال",
        "contact.address": "العنوان:",
        "contact.form.title": "أرسل رسالة",
        "contact.form.name": "اسمك",
        "contact.form.email": "بريدك الإلكتروني",
        "contact.form.message": "رسالتك",
        "contact.form.send": "إرسال"
      }
    };

    const langSelector = document.getElementById('langSelector');
    ['tr','en','ar'].forEach(code => {
      const btn = document.createElement('button');
      btn.textContent = code.toUpperCase();
      btn.addEventListener('click', () => setLanguage(code));
      langSelector.appendChild(btn);
    });

    function setLanguage(lang) {
      localStorage.setItem('siteLang', lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      document.querySelectorAll('#langSelector button').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase() === lang);
      });
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if(translations[lang] && translations[lang][key]) el.innerHTML = translations[lang][key];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if(translations[lang] && translations[lang][key]) el.placeholder = translations[lang][key];
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('siteLang') || 'tr';
      setLanguage(savedLang);
    });
  </script>
</body>
</html>
